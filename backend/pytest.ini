[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    -ra
markers =
    unit: Tests unitaires rapides
    integration: Tests d'intégration (nécessitent Supabase)
    slow: Tests lents
